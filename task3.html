<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.5;
        }

        form {
            max-width: 500px;
        }

        fieldset {
            margin-bottom: 15px;
            padding: 10px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>

    <h1>Форма обратной связи</h1>

    <p>
        Заполните форму ниже. Поля, отмеченные как обязательные,
        должны быть заполнены перед отправкой.
    </p>

    <form action="#" method="post">

        <fieldset>
            <legend>Личные данные</legend>

            <p>
                <label for="username">Имя пользователя:</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="2"
                    maxlength="50"
                    placeholder="Введите имя"
                >
            </p>

            <p>
                <label for="email">Адрес электронной почты:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="example@mail.ru"
                >
            </p>

            <p>
                Пол:
            </p>

            <p>
                <label>
                    <input type="radio" name="gender" value="male" required>
                    Мужской
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Женский
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Другой
                </label>
            </p>

            <p>
                <label for="country">Страна проживания:</label>
                <select id="country" name="country" required>
                    <option value="" selected disabled>Выберите страну</option>
                    <option value="ru">Россия</option>
                    <option value="by">Беларусь</option>
                    <option value="kz">Казахстан</option>
                    <option value="uz">Узбекистан</option>
                </select>
            </p>

        </fieldset>

        <fieldset>
            <legend>Подтверждение</legend>

            <p>
                <label>
                    <input type="checkbox" name="agree" required>
                    Я подтверждаю согласие с условиями обработки персональных данных.
                </label>
            </p>
        </fieldset>

        <button type="submit">Отправить форму</button>

    </form>

</body>
</html>
